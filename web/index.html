<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agents Arena</title>
<style>
  body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #111; }
  #hud { position: absolute; top: 12px; left: 12px; color: #fff; background: rgba(0,0,0,.6);
         padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.8; min-width: 230px; }
  #bar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
         display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
         background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 10px; }
  button { background: #2b2f36; color: #fff; border: 1px solid #444; border-radius: 6px;
           padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a4049; }
  button.on { background: #3b6fd4; border-color: #3b6fd4; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="bar"></div>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const R = window.REPLAY;
const COLORS = { random: 0xff4444, wall_follow: 0x44dd66, PPO: 0x4488ff };
const SIM_FPS = 10;   // simulation dt = 0.1 s

// ---------- scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ab8d4);
scene.fog = new THREE.Fog(0x9ab8d4, 120, 320);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 70, 55);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a5a2a, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, far: 300 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0x4a7a3a }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

// ---------- smooth track ----------
// simulation (x, y) -> three (x, height, -y); resample with a closed spline
function smooth(points, n = 600) {
  const v = points.map(p => new THREE.Vector3(p[0], 0, -p[1]));
  const curve = new THREE.CatmullRomCurve3(v, true, "centripetal");
  return curve.getSpacedPoints(n).slice(0, n);
}

function ribbon(A, B, yA, yB, color, roughness = 0.9) {
  const n = A.length, pos = [], idx = [];
  for (let i = 0; i < n; i++) pos.push(A[i].x, yA, A[i].z, B[i].x, yB, B[i].z);
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    idx.push(2 * i, 2 * i + 1, 2 * j, 2 * i + 1, 2 * j + 1, 2 * j);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness, side: THREE.DoubleSide }));
  m.receiveShadow = true;
  m.castShadow = true;
  scene.add(m);
}

const L = smooth(R.track.left), Rt = smooth(R.track.right), C = smooth(R.track.center);
ribbon(L, Rt, 0, 0, 0x34373d);          // road
ribbon(L, L, 0, 1.0, 0xe8e8e8, 0.5);     // left wall
ribbon(Rt, Rt, 0, 1.0, 0xe8e8e8, 0.5);   // right wall

// dashed center line
const cl = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(C.map(p => new THREE.Vector3(p.x, 0.03, p.z)).concat([new THREE.Vector3(C[0].x, 0.03, C[0].z)])),
  new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 1.2, gapSize: 1.2 }));
cl.computeLineDistances();
scene.add(cl);

// start/finish line at the first track point
(function () {
  const a = L[0], b = Rt[0];
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, a.distanceTo(b)),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  m.rotation.x = -Math.PI / 2;
  m.position.set((a.x + b.x) / 2, 0.04, (a.z + b.z) / 2);
  m.rotation.z = Math.atan2(b.x - a.x, b.z - a.z) + Math.PI / 2;
  scene.add(m);
})();

// ---------- cars + trails ----------
const names = Object.keys(R.agents);
const cars = {}, trails = {};
for (const name of names) {
  const col = COLORS[name] || 0xffffff;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.7, 1.3),
    new THREE.MeshStandardMaterial({ color: col, metalness: 0.4, roughness: 0.4 }));
  body.position.y = 0.55;
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 1.0),
    new THREE.MeshStandardMaterial({ color: 0x222831 }));
  cabin.position.set(-0.2, 1.1, 0);
  [body, cabin].forEach(m => { m.castShadow = true; g.add(m); });
  scene.add(g);
  cars[name] = g;

  const traj = R.agents[name].traj;
  const tg = new THREE.BufferGeometry();
  tg.setAttribute("position", new THREE.Float32BufferAttribute(
    traj.flatMap(p => [p[0], 0.08, -p[1]]), 3));
  tg.setDrawRange(0, 0);
  const line = new THREE.Line(tg, new THREE.LineBasicMaterial({ color: col }));
  scene.add(line);
  trails[name] = line;
}

// ---------- playback state ----------
let t = 0, speed = 1, paused = false, follow = 0;   // follow: 0 = free, 1..n = car
const lookTarget = new THREE.Vector3();

// ---------- buttons ----------
const bar = document.getElementById("bar");
const buttons = {};
function addBtn(id, label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = fn;
  bar.appendChild(b);
  buttons[id] = b;
}
function refresh() {
  buttons.pause.textContent = paused ? "Play" : "Pause";
  [0.5, 1, 2].forEach(s => buttons["s" + s].classList.toggle("on", speed === s));
  for (let i = 0; i <= names.length; i++) buttons["c" + i].classList.toggle("on", follow === i);
}
addBtn("restart", "Restart", () => { t = 0; });
addBtn("pause", "Pause", () => { paused = !paused; refresh(); });
[0.5, 1, 2].forEach(s => addBtn("s" + s, s + "x", () => { speed = s; refresh(); }));
addBtn("c0", "Free camera", () => { follow = 0; controls.target.set(0, 0, 0); refresh(); });
names.forEach((n, i) => addBtn("c" + (i + 1), "Follow " + n, () => { follow = i + 1; refresh(); }));
refresh();

addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); t = 0; }
  if (e.key === "p") { paused = !paused; refresh(); }
  const k = parseInt(e.key);
  if (!isNaN(k) && k <= names.length) { follow = k; refresh(); }
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
const hud = document.getElementById("hud");
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (!paused) t += dt * SIM_FPS * speed;

  let html = `<b>Agents Arena</b> &nbsp; <small>${(t / SIM_FPS).toFixed(1)} s</small><br>`;
  for (const name of names) {
    const a = R.agents[name];
    const last = a.traj.length - 1;
    const tt = Math.min(t, last);
    const i = Math.floor(tt), f = tt - i;
    const p0 = a.traj[i], p1 = a.traj[Math.min(i + 1, last)];
    const x = p0[0] + (p1[0] - p0[0]) * f;
    const y = p0[1] + (p1[1] - p0[1]) * f;
    const ang = p0[2] + (p1[2] - p0[2]) * f;

    cars[name].position.set(x, 0, -y);
    cars[name].rotation.y = ang;
    trails[name].geometry.setDrawRange(0, i + 1);

    const done = t >= last;
    const status = done ? (a.lap ? "lap in " + a.steps + " steps" : a.crashed ? "crashed" : "timeout")
                        : "step " + Math.floor(t);
    const col = "#" + (COLORS[name] || 0xffffff).toString(16).padStart(6, "0");
    html += `<span class="dot" style="background:${col}"></span>${name}: ${status}<br>`;
  }
  hud.innerHTML = html;

  if (follow > 0) {
    const car = cars[names[follow - 1]];
    const a = car.rotation.y;
    const want = new THREE.Vector3(
      car.position.x - Math.cos(a) * 11, 5.5, car.position.z + Math.sin(a) * 11);
    camera.position.lerp(want, 0.08);
    lookTarget.lerp(car.position, 0.15);
    camera.lookAt(lookTarget);
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
